<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>План места происшествия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#E4E9E6; --panel:#F5F7F3; --ink:#1D262B; --muted:#5B686D; --line:#C6CFCB;
  --field:#FFFFFF; --accent:#E2B007; --accent-ink:#2A2200; --focus:#2F6FB3; --danger:#B3402F;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A1C; --panel:#1E2528; --ink:#E3E8E5; --muted:#98A5A8; --line:#34403F;
    --field:#141A1C; --accent:#E8BC1C; --accent-ink:#231C00; --focus:#6FA4DD; --danger:#E07A66;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A1C; --panel:#1E2528; --ink:#E3E8E5; --muted:#98A5A8; --line:#34403F;
  --field:#141A1C; --accent:#E8BC1C; --accent-ink:#231C00; --focus:#6FA4DD; --danger:#E07A66;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;font-weight:700;margin:0 12px 0 0;display:flex;align-items:center;gap:10px}
.dot{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--ink)}
header .grow{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;padding:6px 11px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button.ghost{background:transparent}
button.del{color:var(--danger);border-color:transparent;background:transparent;padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
main{display:grid;grid-template-columns:360px 1fr;min-height:0}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tabs button{border-radius:999px;padding:4px 11px;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.side{overflow:auto;padding:12px;flex:1}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.warn{background:color-mix(in srgb,var(--accent) 22%,transparent);border-left:3px solid var(--accent);padding:6px 9px;font-size:12.5px;margin:0 0 10px;border-radius:0 4px 4px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:9px;margin:0 0 9px;background:var(--field)}
.card.sel{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 30%,transparent)}
.card-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.card-h select{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid.two{grid-template-columns:1fr 1fr}
.f{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);min-width:0}
.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:100%;min-width:0}
textarea{resize:vertical;min-height:44px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);margin:4px 0}
.chk input{width:auto}
h3{font-size:13px;margin:14px 0 7px;font-weight:600}
h3:first-child{margin-top:0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.mk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:1.5px solid #1D262B;font-weight:700;font-size:12px;flex:none}
.stage{overflow:auto;min-height:0;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sheet{background:#fff;box-shadow:0 2px 14px rgba(20,30,35,.18);flex:none;touch-action:none;user-select:none}
.legendline{color:var(--muted);font-size:12px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:46vh;border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1><span class="dot">1</span>План места происшествия</h1>
  <span class="grow"></span>
  <button id="zOut" class="ghost" title="Уменьшить">−</button>
  <button id="zFit" class="ghost">По размеру</button>
  <button id="zIn" class="ghost" title="Увеличить">+</button>
  <button id="bOpen">Открыть проект</button>
  <button id="bSave">Сохранить проект</button>
  <button id="bSvg">SVG</button>
  <button id="bPdf" class="primary">Скачать PDF A3</button>
  <input type="file" id="fOpen" accept=".json,application/json" hidden>
</header>
<main>
  <aside>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="side" id="side"></div>
  </aside>
  <div class="stage" id="stage">
    <svg id="sheet" class="sheet" viewBox="0 0 420 297" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="legendline">Перетаскивайте мебель, метки и элементы стен мышью. Точные значения правьте слева.</div>
  </div>
</main>
</div>
<div id="toast"></div>

<script>
/* ===== Данные ===== */
const KEY='mesto-plan-v1';
const WALLS={A:'А',B:'Б',V:'В',G:'Г'};
const WI_TYPES={window:'Окно',door:'Дверь',radiator:'Радиатор',board:'Доска',screen:'Экран',picture:'Картина',hanger:'Вешалка',camera:'Видеокамера',other:'Другое'};
const IT_TYPES={desk:'Стол (парта)',chair:'Стул',teacher:'Стол преподавателя',lectern:'Кафедра (К)',table:'Стол',cabinet:'Шкаф',projector:'Проектор (на потолке)',other:'Другое'};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const r2=v=>Math.round(v*100)/100;
const fmt=v=>r2(v).toFixed(2).replace('.',',');

function blank(){
  return {room:{L:10,W:6,h:3,mode:'schematic',scale:100,showDims:true,showTies:true},
    wallNames:{A:'',B:'',V:'',G:''},wallItems:[],items:[],markers:[],
    stamp:{name:'План-схема места происшествия',object:'',protocol:'',date:'',author:'',members:''},
    north:'',notes:'',underlay:{src:'',show:true,opacity:0.45,scale:100,dx:0,dy:0}};
}
function example(){
  const s=blank();
  s.room={L:12,W:7,h:3.2,mode:'schematic',scale:100,showDims:true,showTies:true};
  s.wallNames={A:'оконная',B:'с дверями',V:'передняя',G:'задняя'};
  const wi=(wall,type,label,off,z,w,h,extra={})=>s.wallItems.push({id:uid(),wall,type,label,off,z,w,h,open:false,hinge:'start',...extra});
  [1.0,3.2,5.4,7.6,9.8].forEach(o=>{wi('A','window','',o,0.9,1.4,1.8);wi('A','radiator','',o+0.1,0.15,1.2,0.6);});
  wi('B','door','Д1',1.2,0,1.0,2.1);wi('B','door','Д2',9.8,0,1.0,2.1,{hinge:'end'});
  wi('B','hanger','вешалка',3.6,1.5,1.8,0.3);wi('B','picture','картина',6.2,1.4,0.8,0.6);wi('B','picture','картина',7.6,1.4,0.8,0.6);
  wi('V','screen','экран',1.6,1.3,2.2,1.4);wi('V','board','доска',4.1,0.9,2.0,1.1);wi('V','camera','камера',6.5,2.75,0.3,0.2);
  wi('G','window','окно',0.8,0.9,1.4,1.8,{open:true});wi('G','radiator','',0.9,0.15,1.2,0.6);
  wi('G','window','',4.2,0.9,1.4,1.8);wi('G','radiator','',4.3,0.15,1.2,0.6);
  const it=(type,label,x,y,w,d)=>s.items.push({id:uid(),type,label,x,y,w,d});
  it('teacher','',0.8,0.7,0.8,1.6);it('lectern','',0.6,2.6,0.6,0.6);it('table','',0.8,5.6,0.7,0.9);it('projector','',5.5,3.25,0.5,0.5);
  genRows(s,{rows:10,x0:2.6,step:0.85,depth:0.5,margin:0.5,aisle:0.8});
  s.markers=[
    {id:uid(),n:'1',desc:'Предметы на столе преподавателя: клавиатура, мышь, карандаши',place:'floor',x:1.2,y:1.5,wall:'A',off:1,z:1},
    {id:uid(),n:'2',desc:'Окно с открытой внутрь створкой (предполагаемый путь проникновения)',place:'wall',x:0,y:0,wall:'G',off:1.5,z:1.8},
    {id:uid(),n:'3',desc:'Грязевой след на наружном отливе окна № 2 (снаружи здания)',place:'outside',x:0,y:0,wall:'G',off:1.5,z:0},
    {id:uid(),n:'4',desc:'Шариковая ручка на полу в центральном проходе',place:'floor',x:11,y:3.5,wall:'A',off:1,z:1}];
  s.stamp={name:'План-схема места происшествия',object:'Аудитория, ул. Широкая, 33',protocol:'приложение к протоколу осмотра места происшествия от 22.10.2026',date:'22.10.2026',author:'',members:''};
  return s;
}
function genRows(s,p){
  const colW=(s.room.W-2*p.margin-p.aisle)/2;
  for(let i=0;i<p.rows;i++){
    const x=p.x0+i*p.step;
    s.items.push({id:uid(),type:'desk',label:'',x,y:p.margin,w:p.depth,d:colW});
    s.items.push({id:uid(),type:'desk',label:'',x,y:p.margin+colW+p.aisle,w:p.depth,d:colW});
  }
}

let state;
try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):example();}catch(e){state=example();}
state.underlay=state.underlay||blank().underlay;
let sel=null, tab='room', zoom=1;
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){try{const c={...state,underlay:{...state.underlay,src:''}};localStorage.setItem(KEY,JSON.stringify(c));}catch(_){}}
},300);}

/* ===== Геометрия ===== */
function geom(){
  const {L,W,h}=state.room;
  const area={x:24,y:28,w:264,h:256}, pad=15;
  const totW=L+2*h, totH=W+2*h;
  const s=state.room.mode==='scale'?1000/state.room.scale:Math.min((area.w-2*pad)/totW,(area.h-2*pad)/totH);
  const fits=totW*s<=area.w-2*pad+0.01&&totH*s<=area.h-2*pad+0.01;
  const fx=area.x+(area.w-totW*s)/2+h*s, fy=area.y+(area.h-totH*s)/2+h*s;
  return {L,W,h,s,fx,fy,fits};
}
const wallLen=(g,w)=>(w==='A'||w==='B')?g.L:g.W;
function wallPt(g,w,t){const{fx,fy,s,L,W}=g;return w==='A'?[fx+t*s,fy]:w==='B'?[fx+t*s,fy+W*s]:w==='V'?[fx,fy+t*s]:[fx+L*s,fy+t*s];}
const inward=w=>w==='A'?[0,1]:w==='B'?[0,-1]:w==='V'?[1,0]:[-1,0];
function unf(g,w,off,z){const{fx,fy,s,L,W}=g;return w==='A'?[fx+off*s,fy-z*s]:w==='B'?[fx+off*s,fy+W*s+z*s]:w==='V'?[fx-z*s,fy+off*s]:[fx+L*s+z*s,fy+off*s];}
function unfRect(g,w,off,z,len,eh){const a=unf(g,w,off,z),b=unf(g,w,off+len,z+eh);return{x:Math.min(a[0],b[0]),y:Math.min(a[1],b[1]),w:Math.abs(a[0]-b[0]),h:Math.abs(a[1]-b[1])};}
function wallDelta(w,dx,dy,s){return w==='A'?[dx/s,-dy/s]:w==='B'?[dx/s,dy/s]:w==='V'?[dy/s,-dx/s]:[dy/s,dx/s];}
const outward=w=>{const i=inward(w);return[-i[0],-i[1]];};

/* ===== SVG-примитивы ===== */
const FONT='Arial, "Liberation Sans", Helvetica, sans-serif';
const R=(x,y,w,h,a='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${a}/>`;
const Ln=(x1,y1,x2,y2,a='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${a}/>`;
function T(x,y,str,o={}){const sz=o.size||2.6;const rot=o.rot?` transform="rotate(${o.rot} ${x} ${y})"`:'';
  return `<text x="${x}" y="${y}" font-family='${FONT}' font-size="${sz}" text-anchor="${o.anchor||'start'}" font-weight="${o.weight||400}" fill="${o.fill||'#111'}" dominant-baseline="${o.base||'auto'}"${rot}>${esc(str)}</text>`;}
function wrap(str,max){const words=String(str).split(/\s+/);const out=[];let cur='';for(const w of words){if((cur+' '+w).trim().length>max&&cur){out.push(cur);cur=w;}else cur=(cur+' '+w).trim();}if(cur)out.push(cur);return out;}
function marker(x,y,n,r=2.8){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#F2C200" stroke="#111" stroke-width="0.35"/>`+T(x,y+0.05,n,{size:r*1.05,anchor:'middle',weight:700,base:'central'});}
const selA=(kind,id)=>(!exporting&&sel&&sel.kind===kind&&sel.id===id);
const SEL='stroke="#2F6FB3" stroke-width="0.7" fill="none"';
let exporting=false;

/* ===== Отрисовка листа ===== */
function drawSheet(){
  const g=geom(), st=state, P=[];
  const {fx,fy,s,L,W,h}=g;
  const sc=st.room.mode==='scale';
  P.push(R(0,0,420,297,'fill="#fff"'));
  P.push(R(20,5,395,287,'fill="none" stroke="#111" stroke-width="0.5"'));
  P.push(Ln(20,24,415,24,'stroke="#111" stroke-width="0.3"'));
  P.push(Ln(292,24,292,292,'stroke="#111" stroke-width="0.3"'));
  P.push(T(217.5,13,'Развёрнутый план помещения (план-схема с развёрткой стен)',{size:4.4,anchor:'middle',weight:700}));
  const sub=[st.stamp.object,st.stamp.protocol].filter(Boolean).join(' — ');
  if(sub)P.push(T(217.5,19.6,sub,{size:2.9,anchor:'middle'}));

  /* развёртка стен */
  const full={A:unfRect(g,'A',0,0,L,h),B:unfRect(g,'B',0,0,L,h),V:unfRect(g,'V',0,0,W,h),G:unfRect(g,'G',0,0,W,h)};
  for(const w in full){const r=full[w];P.push(R(r.x,r.y,r.w,r.h,'fill="#FAFAF8" stroke="#111" stroke-width="0.3"'));}
  // линии сгиба
  P.push(R(fx,fy,L*s,W*s,'fill="none" stroke="#111" stroke-width="0.25" stroke-dasharray="4 1 0.6 1"'));
  // подписи стен
  const wl=w=>`СТЕНА ${WALLS[w]}${st.wallNames[w]?' — '+st.wallNames[w]:''} (развёртка)`;
  P.push(T(fx+L*s/2,full.A.y+3.6,wl('A'),{size:2.5,anchor:'middle',weight:700,fill:'#444'}));
  P.push(T(fx+L*s/2,full.B.y+full.B.h-1.6,wl('B'),{size:2.5,anchor:'middle',weight:700,fill:'#444'}));
  P.push(T(full.V.x+3.2,fy+W*s/2,wl('V'),{size:2.5,anchor:'middle',weight:700,fill:'#444',rot:-90}));
  P.push(T(full.G.x+full.G.w-3.2,fy+W*s/2,wl('G'),{size:2.5,anchor:'middle',weight:700,fill:'#444',rot:90}));

  /* элементы на развёртке */
  for(const it of st.wallItems){
    const r=unfRect(g,it.wall,it.off,it.z,it.w,it.h);
    const vert=it.wall==='V'||it.wall==='G';
    const a=`data-kind="wi" data-id="${it.id}" style="cursor:move"`;
    let body='';
    if(it.type==='window'){
      body+=R(r.x,r.y,r.w,r.h,'fill="#EAF1F5" stroke="#111" stroke-width="0.3"');
      const cx=r.x+r.w/2,cy=r.y+r.h/2;
      body+=vert?Ln(r.x,cy,r.x+r.w,cy,'stroke="#111" stroke-width="0.2"'):Ln(cx,r.y,cx,r.y+r.h,'stroke="#111" stroke-width="0.2"');
      if(it.open){body+=`<path d="M${r.x} ${r.y} L${r.x+r.w} ${cy} L${r.x} ${r.y+r.h}" fill="none" stroke="#111" stroke-width="0.25" stroke-dasharray="1 0.6"/>`;}
    }else if(it.type==='door'){
      body+=R(r.x,r.y,r.w,r.h,'fill="#F1ECE2" stroke="#111" stroke-width="0.35"');
    }else if(it.type==='radiator'){
      body+=R(r.x,r.y,r.w,r.h,'fill="#fff" stroke="#111" stroke-width="0.25"');
      const n=Math.max(3,Math.round((vert?r.h:r.w)/1.2));
      for(let i=1;i<n;i++){body+=vert?Ln(r.x,r.y+r.h*i/n,r.x+r.w,r.y+r.h*i/n,'stroke="#111" stroke-width="0.12"'):Ln(r.x+r.w*i/n,r.y,r.x+r.w*i/n,r.y+r.h,'stroke="#111" stroke-width="0.12"');}
    }else if(it.type==='board'||it.type==='screen'){
      body+=R(r.x,r.y,r.w,r.h,`fill="${it.type==='board'?'#E3E8E4':'#fff'}" stroke="#111" stroke-width="0.35"`);
    }else if(it.type==='picture'){
      body+=R(r.x,r.y,r.w,r.h,'fill="#fff" stroke="#111" stroke-width="0.3"')+R(r.x+0.7,r.y+0.7,Math.max(0,r.w-1.4),Math.max(0,r.h-1.4),'fill="none" stroke="#111" stroke-width="0.15"');
    }else{
      body+=R(r.x,r.y,r.w,r.h,'fill="#fff" stroke="#111" stroke-width="0.3"');
    }
    const lab=it.label||(it.type==='window'||it.type==='radiator'?'':WI_TYPES[it.type].toLowerCase());
    if(lab){
      const cx=r.x+r.w/2,cy=r.y+r.h/2;
      const fits=(vert?r.h:r.w)>lab.length*1.05;
      if(fits)body+=T(cx,cy,lab,{size:2,anchor:'middle',base:'central',rot:it.wall==='V'?-90:it.wall==='G'?90:0});
      else{const o=outward(it.wall);const tx=vert?r.x+r.w/2:cx,ty=vert?cy:r.y+r.h/2;
        body+=T(tx+(vert?o[0]*(r.w/2+2.6):0),ty+(vert?0:-r.h/2-1.2),lab,{size:2,anchor:'middle',base:'central',rot:it.wall==='V'?-90:it.wall==='G'?90:0});}
    }
    if(selA('wi',it.id))body+=R(r.x-0.8,r.y-0.8,r.w+1.6,r.h+1.6,SEL);
    P.push(`<g ${a}>${body}<rect x="${r.x-1}" y="${r.y-1}" width="${r.w+2}" height="${r.h+2}" fill="transparent"/></g>`);
  }

  /* пол */
  P.push(R(fx,fy,L*s,W*s,'fill="#fff"'));
  const u=st.underlay;
  if(u.src&&u.show){
    const k=(u.scale||100)/100;
    P.push(`<image href="${u.src}" x="${fx+(+u.dx||0)*s}" y="${fy+(+u.dy||0)*s}" width="${L*s*k}" height="${W*s*k}" preserveAspectRatio="xMidYMid meet" opacity="${u.opacity}"/>`);
  }
  for(const it of st.items){
    const x=fx+it.x*s,y=fy+it.y*s,w=it.w*s,d=it.d*s;
    let b='';
    if(it.type==='projector'){
      b+=R(x,y,w,d,'fill="none" stroke="#111" stroke-width="0.25" stroke-dasharray="1 0.6"')+Ln(x,y,x+w,y+d,'stroke="#111" stroke-width="0.15"')+Ln(x+w,y,x,y+d,'stroke="#111" stroke-width="0.15"');
    }else if(it.type==='teacher'){
      b+=R(x,y,w,d,'fill="#ECECEC" stroke="#111" stroke-width="0.35"');
    }else if(it.type==='lectern'){
      b+=R(x,y,w,d,'fill="#fff" stroke="#111" stroke-width="0.35"')+T(x+w/2,y+d/2,'К',{size:Math.min(w,d)*0.6,anchor:'middle',base:'central',weight:700});
    }else if(it.type==='cabinet'){
      b+=R(x,y,w,d,'fill="#fff" stroke="#111" stroke-width="0.3"')+Ln(x,y,x+w,y+d,'stroke="#111" stroke-width="0.15"');
    }else if(it.type==='chair'){
      b+=R(x,y,w,d,'fill="#fff" stroke="#111" stroke-width="0.2"');
    }else{
      b+=R(x,y,w,d,'fill="#fff" stroke="#111" stroke-width="0.25"');
    }
    if(it.label){const rot=d>w*1.6&&it.label.length*1.0>w?-90:0;b+=T(x+w/2,y+d/2,it.label,{size:1.8,anchor:'middle',base:'central',rot});}
    if(selA('it',it.id))b+=R(x-0.8,y-0.8,w+1.6,d+1.6,SEL);
    P.push(`<g data-kind="it" data-id="${it.id}" style="cursor:move">${b}</g>`);
  }
  // контур помещения
  P.push(R(fx,fy,L*s,W*s,'fill="none" stroke="#111" stroke-width="0.9"'));
  // проёмы и радиаторы на плане
  for(const it of st.wallItems){
    if(!['window','door','radiator'].includes(it.type))continue;
    const p1=wallPt(g,it.wall,it.off),p2=wallPt(g,it.wall,it.off+it.w),n=inward(it.wall);
    let b='';
    if(it.type==='radiator'){
      const a=[p1[0]+n[0]*0.08*s,p1[1]+n[1]*0.08*s],c=[p2[0]+n[0]*0.22*s,p2[1]+n[1]*0.22*s];
      b+=R(Math.min(a[0],c[0]),Math.min(a[1],c[1]),Math.abs(a[0]-c[0]),Math.abs(a[1]-c[1]),'fill="#fff" stroke="#111" stroke-width="0.2"');
    }else{
      b+=Ln(p1[0],p1[1],p2[0],p2[1],'stroke="#fff" stroke-width="1.4"');
      const o=0.45;
      b+=Ln(p1[0]-n[0]*o,p1[1]-n[1]*o,p1[0]+n[0]*o,p1[1]+n[1]*o,'stroke="#111" stroke-width="0.35"');
      b+=Ln(p2[0]-n[0]*o,p2[1]-n[1]*o,p2[0]+n[0]*o,p2[1]+n[1]*o,'stroke="#111" stroke-width="0.35"');
      if(it.type==='window'){
        for(const k of[-0.3,0.3])b+=Ln(p1[0]+n[0]*k,p1[1]+n[1]*k,p2[0]+n[0]*k,p2[1]+n[1]*k,'stroke="#111" stroke-width="0.15"');
      }
      const hinge=it.hinge==='end'?p2:p1, other=it.hinge==='end'?p1:p2;
      const len=Math.hypot(other[0]-hinge[0],other[1]-hinge[1]);
      if(it.type==='door'||it.open){
        const r=it.type==='door'?len:len*0.55;
        const uu=[(other[0]-hinge[0])/len,(other[1]-hinge[1])/len];
        const ang=it.type==='door'?Math.PI/2:Math.PI/4;
        const leaf=[hinge[0]+r*(Math.cos(ang)*uu[0]+Math.sin(ang)*n[0]),hinge[1]+r*(Math.cos(ang)*uu[1]+Math.sin(ang)*n[1])];
        b+=Ln(hinge[0],hinge[1],leaf[0],leaf[1],`stroke="#111" stroke-width="${it.type==='door'?0.35:0.3}"`);
        const pts=[];for(let i=0;i<=14;i++){const t=ang*i/14;pts.push([hinge[0]+r*(Math.cos(t)*uu[0]+Math.sin(t)*n[0]),hinge[1]+r*(Math.cos(t)*uu[1]+Math.sin(t)*n[1])].map(v=>v.toFixed(2)).join(','));}
        b+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#111" stroke-width="0.15" stroke-dasharray="0.8 0.5"/>`;
      }
      if(it.type==='door'&&it.label){const m=[(p1[0]+p2[0])/2-n[0]*2.4,(p1[1]+p2[1])/2-n[1]*2.4];
        // подпись двери кладём на развёртку не перекрывая: смещение наружу уже внутри развёртки, поэтому — внутрь
        const mi=[(p1[0]+p2[0])/2+n[0]*(len+2.2),(p1[1]+p2[1])/2+n[1]*(len+2.2)];
        b+=T(mi[0],mi[1],it.label,{size:2.2,anchor:'middle',base:'central',weight:700});void m;}
    }
    P.push(`<g data-kind="wi" data-id="${it.id}" style="cursor:move">${b}</g>`);
  }

  /* размеры */
  const dimTxt=(name,v)=>(sc&&st.room.showDims)?`${name} = ${fmt(v)} м`:`${name} = ______ м`;
  const dimH=(x1,x2,y,txt)=>Ln(x1,y,x2,y,'stroke="#111" stroke-width="0.18"')+Ln(x1,y-1.5,x1,y+1.5,'stroke="#111" stroke-width="0.18"')+Ln(x2,y-1.5,x2,y+1.5,'stroke="#111" stroke-width="0.18"')+Ln(x1-0.9,y+0.9,x1+0.9,y-0.9,'stroke="#111" stroke-width="0.35"')+Ln(x2-0.9,y+0.9,x2+0.9,y-0.9,'stroke="#111" stroke-width="0.35"')+T((x1+x2)/2,y-1.1,txt,{size:2.4,anchor:'middle'});
  const dimV=(x,y1,y2,txt)=>Ln(x,y1,x,y2,'stroke="#111" stroke-width="0.18"')+Ln(x-1.5,y1,x+1.5,y1,'stroke="#111" stroke-width="0.18"')+Ln(x-1.5,y2,x+1.5,y2,'stroke="#111" stroke-width="0.18"')+Ln(x-0.9,y1+0.9,x+0.9,y1-0.9,'stroke="#111" stroke-width="0.35"')+Ln(x-0.9,y2+0.9,x+0.9,y2-0.9,'stroke="#111" stroke-width="0.35"')+T(x-1.1,(y1+y2)/2,txt,{size:2.4,anchor:'middle',rot:-90});
  P.push(dimH(fx,fx+L*s,fy-h*s-5,dimTxt('L',L)));
  P.push(dimV(fx-h*s-5,fy,fy+W*s,dimTxt('W',W)));
  P.push(dimV(fx+L*s+6,fy-h*s,fy,dimTxt('h',h)));

  /* метки */
  for(const m of st.markers){
    let x,y,extra='';
    if(m.place==='floor'){
      x=fx+m.x*s;y=fy+m.y*s;
      if(st.room.showTies){
        const toV=m.x<=L/2, toA=m.y<=W/2;
        const wx=toV?fx:fx+L*s, wy=toA?fy:fy+W*s;
        const dx=toV?m.x:L-m.x, dy=toA?m.y:W-m.y;
        const lab=v=>(sc&&st.room.showDims)?fmt(v):'____';
        extra+=Ln(x,y,wx,y,'stroke="#2B5D8A" stroke-width="0.18" stroke-dasharray="1 0.6"')+T((x+wx)/2,y-0.9,lab(dx),{size:1.9,anchor:'middle',fill:'#2B5D8A'});
        extra+=Ln(x,y,x,wy,'stroke="#2B5D8A" stroke-width="0.18" stroke-dasharray="1 0.6"')+T(x+0.9,(y+wy)/2,lab(dy),{size:1.9,fill:'#2B5D8A',base:'central'});
      }
    }else if(m.place==='wall'){
      [x,y]=unf(g,m.wall,m.off,m.z);
    }else{
      const p=unf(g,m.wall,m.off,h),o=outward(m.wall);
      x=p[0]+o[0]*7;y=p[1]+o[1]*7;
      const q=unf(g,m.wall,m.off,h);
      extra+=Ln(x,y,q[0],q[1],'stroke="#111" stroke-width="0.15" stroke-dasharray="0.8 0.5"');
      const vert=m.wall==='V'||m.wall==='G';
      extra+=T(x+(vert?0:4),y+(vert?5:0.9),'снаружи',{size:1.9,anchor:vert?'middle':'start',fill:'#333'});
    }
    let b=extra+marker(x,y,m.n);
    if(selA('mk',m.id))b+=`<circle cx="${x}" cy="${y}" r="4" ${SEL}/>`;
    P.push(`<g data-kind="mk" data-id="${m.id}" style="cursor:move">${b}</g>`);
  }

  /* север */
  const nv=parseFloat(String(st.north).replace(',','.'));
  if(!isNaN(nv)){
    const cx=278,cy=40;
    P.push(`<g transform="rotate(${nv} ${cx} ${cy})">`+`<path d="M${cx} ${cy-7} L${cx+2.2} ${cy+4} L${cx} ${cy+2.4} L${cx-2.2} ${cy+4} Z" fill="#111"/>`+T(cx,cy-8.5,'С',{size:3.2,anchor:'middle',weight:700})+'</g>');
  }

  /* правая колонка */
  let y=33; const x0=296, cw=115;
  P.push(T(x0,y,'Условные обозначения',{size:3.2,weight:700}));y+=5;
  for(const m of st.markers){
    const lines=wrap(m.desc||'—',46);
    P.push(marker(x0+2.6,y+0.4,m.n,2.4));
    lines.forEach((l,i)=>P.push(T(x0+7,y+1.2+i*3.1,l,{size:2.4})));
    y+=Math.max(6,lines.length*3.1+2.6);
  }
  y+=1;
  const used=new Set([...st.wallItems.map(i=>i.type+(i.type==='window'&&i.open?'_open':'')),...st.items.map(i=>i.type)]);
  const sym=(draw,label)=>{P.push(draw(x0,y));P.push(T(x0+13,y+2.2,label,{size:2.3}));y+=5.2;};
  const K='stroke="#111"';
  if(used.has('window')||used.has('window_open'))sym((x,yy)=>Ln(x,yy+1.5,x+10,yy+1.5,`${K} stroke-width="0.9"`)+Ln(x+2,yy+1.5,x+8,yy+1.5,'stroke="#fff" stroke-width="1.4"')+Ln(x+2,yy+1.2,x+8,yy+1.2,`${K} stroke-width="0.15"`)+Ln(x+2,yy+1.8,x+8,yy+1.8,`${K} stroke-width="0.15"`),'Оконный проём');
  if(used.has('window_open'))sym((x,yy)=>Ln(x,yy+1,x+10,yy+1,`${K} stroke-width="0.9"`)+Ln(x+2,yy+1,x+8,yy+1,'stroke="#fff" stroke-width="1.4"')+Ln(x+2,yy+1,x+4.4,yy+3.4,`${K} stroke-width="0.3"`),'Створка окна, открытая внутрь');
  if(used.has('door'))sym((x,yy)=>Ln(x,yy,x+10,yy,`${K} stroke-width="0.9"`)+Ln(x+2,yy,x+7,yy,'stroke="#fff" stroke-width="1.4"')+Ln(x+2,yy,x+2,yy+4,`${K} stroke-width="0.3"`)+`<path d="M${x+2} ${yy+4} A4 4 0 0 0 ${x+6.5} ${yy+0.4}" fill="none" ${K} stroke-width="0.15" stroke-dasharray="0.8 0.5"/>`,'Дверь (направление открывания)');
  if(used.has('radiator'))sym((x,yy)=>R(x+1,yy+0.6,8,2,`fill="#fff" ${K} stroke-width="0.2"`)+[3,5,7].map(i=>Ln(x+i,yy+0.6,x+i,yy+2.6,`${K} stroke-width="0.12"`)).join(''),'Радиатор отопления');
  if(used.has('desk')||used.has('table'))sym((x,yy)=>R(x+1,yy,8,3,`fill="#fff" ${K} stroke-width="0.25"`),'Стол');
  if(used.has('chair'))sym((x,yy)=>R(x+3.5,yy+0.3,2.4,2.4,`fill="#fff" ${K} stroke-width="0.2"`),'Стул');
  if(used.has('teacher'))sym((x,yy)=>R(x+1,yy,8,3,`fill="#ECECEC" ${K} stroke-width="0.35"`),'Стол преподавателя');
  if(used.has('lectern'))sym((x,yy)=>R(x+3.3,yy,3,3,`fill="#fff" ${K} stroke-width="0.35"`)+T(x+4.8,yy+1.6,'К',{size:2,anchor:'middle',base:'central',weight:700}),'Кафедра (трибуна)');
  if(used.has('cabinet'))sym((x,yy)=>R(x+1,yy,8,3,`fill="#fff" ${K} stroke-width="0.3"`)+Ln(x+1,yy,x+9,yy+3,`${K} stroke-width="0.15"`),'Шкаф');
  if(used.has('projector'))sym((x,yy)=>R(x+3.3,yy,3,3,`fill="none" ${K} stroke-width="0.25" stroke-dasharray="1 0.6"`)+Ln(x+3.3,yy,x+6.3,yy+3,`${K} stroke-width="0.15"`)+Ln(x+6.3,yy,x+3.3,yy+3,`${K} stroke-width="0.15"`),'Проектор (на потолке)');
  sym((x,yy)=>Ln(x,yy+1.5,x+10,yy+1.5,`${K} stroke-width="0.25" stroke-dasharray="4 1 0.6 1"`),'Линия сгиба (стены развёрнуты на пол)');
  if(st.room.showTies&&st.markers.some(m=>m.place==='floor'))sym((x,yy)=>Ln(x,yy+1.5,x+10,yy+1.5,'stroke="#2B5D8A" stroke-width="0.25" stroke-dasharray="1 0.6"'),'Привязка метки к стенам, м');

  y+=2;
  P.push(T(x0,y,'Примечания',{size:3.2,weight:700}));y+=4.6;
  const notes=[];
  notes.push(sc?`План выполнен в масштабе 1:${st.room.scale}.`:'Схема составлена по фотоснимкам, масштаб не соблюдён.');
  if(!sc||!st.room.showDims)notes.push('Размеры L, W, h и расстояния от меток до стен внести по результатам замеров.');
  notes.push(isNaN(nv)?'Направление на север: ____________________':'Направление на север указано стрелкой «С».');
  st.markers.filter(m=>m.place==='outside').forEach(m=>notes.push(`Метка № ${m.n} находится вне помещения.`));
  String(st.notes||'').split('\n').map(t=>t.trim()).filter(Boolean).forEach(t=>notes.push(t));
  notes.forEach((n,i)=>{wrap(`${i+1}. ${n}`,48).forEach((l,j)=>{P.push(T(x0+(j?3:0),y,l,{size:2.4}));y+=3.1;});y+=0.5;});

  /* штамп */
  const rh=6.6, lw=30, sy=292-rh*7;
  const rows=[['Наименование',st.stamp.name],['Объект',st.stamp.object],['Составил',st.stamp.author],['Участники',st.stamp.members],['Дата',st.stamp.date],['Масштаб',sc?`1:${st.room.scale}`:'без масштаба'],['Лист','1 / 1']];
  P.push(R(x0-4,sy,123,rh*rows.length,'fill="#fff" stroke="#111" stroke-width="0.4"'));
  rows.forEach((r,i)=>{const yy=sy+i*rh;if(i)P.push(Ln(x0-4,yy,x0+119,yy,'stroke="#111" stroke-width="0.2"'));
    P.push(T(x0-2,yy+rh/2+0.9,r[0],{size:2.4,weight:600}));
    const v=wrap(r[1]||'',36);P.push(T(x0+lw,yy+rh/2+0.9,v[0]||'',{size:2.4}));});
  P.push(Ln(x0+lw-2,sy,x0+lw-2,sy+rh*rows.length,'stroke="#111" stroke-width="0.2"'));

  return P.join('');
}

const svg=document.getElementById('sheet');
function renderSheet(){svg.innerHTML=drawSheet();applyZoom();}
function applyZoom(){const stage=document.getElementById('stage');const avail=stage.clientWidth-40;const base=Math.max(320,Math.min(avail,(stage.clientHeight-60)*420/297));svg.style.width=(base*zoom)+'px';}

/* ===== Боковая панель ===== */
const TABS=[['room','Помещение'],['walls','Стены'],['items','Мебель'],['markers','Метки'],['under','Подложка'],['stamp','Штамп']];
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${n}</button>`).join('');}
const fld=(label,path,v,o={})=>`<label class="f${o.wide?' wide':''}"><span>${label}</span>${o.area?`<textarea data-path="${path}">${esc(v)}</textarea>`:`<input data-path="${path}" ${o.num?'data-num="1" inputmode="decimal"':''} value="${esc(o.num?String(v).replace('.',','):v)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>`}</label>`;
const sl=(label,path,v,opts,o={})=>`<label class="f${o.wide?' wide':''}"><span>${label}</span><select data-path="${path}" ${o.re?'data-re="1"':''}>${Object.entries(opts).map(([k,n])=>`<option value="${k}" ${String(k)===String(v)?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`;
const ck=(label,path,v,o={})=>`<label class="chk"><input type="checkbox" data-path="${path}" ${v?'checked':''} ${o.re?'data-re="1"':''}>${label}</label>`;
const wallOpts=Object.fromEntries(Object.entries(WALLS).map(([k,v])=>[k,'Стена '+v]));

function renderSide(){
  const st=state,g=geom();let h='';
  if(tab==='room'){
    h+=`<p class="hint">Пока замеров нет, оставьте «схематично»: размеры на листе будут пустыми строками, впишете от руки. Длины ниже задают только пропорции.</p>`;
    h+=`<div class="grid two">${sl('Режим','room.mode',st.room.mode,{schematic:'Схематично, без размеров',scale:'В масштабе'},{re:1})}`;
    h+=st.room.mode==='scale'?sl('Масштаб','room.scale',st.room.scale,{50:'1:50',100:'1:100',200:'1:200'},{re:1}):'<span></span>';
    h+='</div>';
    if(st.room.mode==='scale'&&!g.fits)h+=`<p class="warn" style="margin-top:8px">План в этом масштабе не помещается на лист A3. Выберите масштаб мельче.</p>`;
    h+=`<h3>${st.room.mode==='scale'?'Размеры помещения, м':'Пропорции помещения (условно), м'}</h3><div class="grid">${fld('Длина L','room.L',st.room.L,{num:1})}${fld('Ширина W','room.W',st.room.W,{num:1})}${fld('Высота h','room.h',st.room.h,{num:1})}</div>`;
    h+=`<h3>Отображение</h3>${ck('Подписывать размеры (в масштабе)','room.showDims',st.room.showDims)}${ck('Привязки меток к стенам','room.showTies',st.room.showTies)}`;
    h+=`<h3>Названия стен</h3><p class="hint">А — сверху, Б — снизу, В — слева, Г — справа от плана пола.</p><div class="grid two">${Object.keys(WALLS).map(k=>fld('Стена '+WALLS[k],'wallNames.'+k,st.wallNames[k],{ph:'напр. оконная'})).join('')}</div>`;
    h+=`<h3>Шаблон</h3><div class="row"><button data-act="example">Пример: наша аудитория</button><button data-act="blank">Пустой план</button></div>`;
  }
  if(tab==='walls'){
    h+=`<p class="hint">Отступ — от левого края стены на развёртке (для В и Г — от стены А). От пола — высота низа элемента.</p>`;
    h+=`<div class="row"><button data-act="addwi" data-t="window">+ Окно</button><button data-act="addwi" data-t="door">+ Дверь</button><button data-act="addwi" data-t="radiator">+ Радиатор</button><button data-act="addwi" data-t="other">+ Другое</button></div>`;
    const order=['A','B','V','G'];
    [...st.wallItems].sort((a,b)=>order.indexOf(a.wall)-order.indexOf(b.wall)||a.off-b.off).forEach(it=>{
      const p='wallItems.'+it.id+'.';
      h+=`<div class="card${sel&&sel.id===it.id?' sel':''}" data-card="${it.id}"><div class="card-h">${sl('',p+'type',it.type,WI_TYPES,{re:1}).replace('<span></span>','')}<button class="del" data-act="del" data-col="wallItems" data-id="${it.id}">Удалить</button></div><div class="grid">`;
      h+=sl('Стена',p+'wall',it.wall,wallOpts,{re:1})+fld('Подпись',p+'label',it.label)+fld('Отступ, м',p+'off',it.off,{num:1})+fld('Ширина, м',p+'w',it.w,{num:1})+fld('От пола, м',p+'z',it.z,{num:1})+fld('Высота, м',p+'h',it.h,{num:1});
      h+='</div>';
      if(it.type==='door'||it.type==='window')h+=`<div class="grid two" style="margin-top:6px">${sl('Петли',p+'hinge',it.hinge,{start:'у начала',end:'у конца'})}${it.type==='window'?`<label class="chk" style="margin-top:14px"><input type="checkbox" data-path="${p}open" ${it.open?'checked':''}>Створка открыта</label>`:'<span></span>'}</div>`;
      h+='</div>';
    });
  }
  if(tab==='items'){
    h+=`<p class="hint">X — от стены В (слева), Y — от стены А (сверху). Размеры по X и по Y.</p>`;
    h+=`<div class="row"><button data-act="additem">+ Предмет</button></div>`;
    h+=`<div class="card"><b style="font-size:13px">Ряды столов</b><p class="hint" style="margin:3px 0 6px">Две колонки с центральным проходом.</p><div class="grid">
      <label class="f"><span>Рядов</span><input id="gRows" value="10" inputmode="numeric"></label>
      <label class="f"><span>Первый ряд X</span><input id="gX0" value="2,6" inputmode="decimal"></label>
      <label class="f"><span>Шаг рядов</span><input id="gStep" value="0,85" inputmode="decimal"></label>
      <label class="f"><span>Глубина стола</span><input id="gDepth" value="0,5" inputmode="decimal"></label>
      <label class="f"><span>Отступ от стен</span><input id="gMargin" value="0,5" inputmode="decimal"></label>
      <label class="f"><span>Проход</span><input id="gAisle" value="0,8" inputmode="decimal"></label></div>
      <div class="row" style="margin:8px 0 0"><button data-act="genrows">Добавить ряды</button><button data-act="clearDesks" class="ghost">Убрать все парты</button></div></div>`;
    st.items.filter(i=>i.type!=='desk'||(sel&&sel.id===i.id)).forEach(it=>{h+=itemCard(it);});
    const n=st.items.filter(i=>i.type==='desk').length;
    if(n)h+=`<p class="hint">Парт на плане: ${n}. Чтобы поправить одну, кликните её на листе.</p>`;
  }
  if(tab==='markers'){
    h+=`<p class="hint">Номера меток — как в протоколе и фототаблице.</p><div class="row"><button data-act="addmk">+ Метка</button></div>`;
    st.markers.forEach(m=>{
      const p='markers.'+m.id+'.';
      h+=`<div class="card${sel&&sel.id===m.id?' sel':''}" data-card="${m.id}"><div class="card-h"><span class="mk">${esc(m.n)}</span><span style="flex:1"></span><button class="del" data-act="del" data-col="markers" data-id="${m.id}">Удалить</button></div><div class="grid">`;
      h+=fld('№',p+'n',m.n)+sl('Где',p+'place',m.place,{floor:'на полу / мебели',wall:'на стене',outside:'вне помещения'},{re:1});
      if(m.place==='floor')h+=fld('X, м',p+'x',m.x,{num:1})+fld('Y, м',p+'y',m.y,{num:1});
      else h+=sl('Стена',p+'wall',m.wall,wallOpts,{re:1})+fld('Отступ, м',p+'off',m.off,{num:1})+(m.place==='wall'?fld('От пола, м',p+'z',m.z,{num:1}):'');
      h+=fld('Описание',p+'desc',m.desc,{wide:1,area:1})+'</div></div>';
    });
  }
  if(tab==='under'){
    const u=st.underlay;
    h+=`<p class="hint">Подложите фото или скан под план пола: снимок сверху, эскиз от руки, план БТИ. Обведите поверх мебелью и метками, затем скройте подложку.</p>`;
    h+=`<div class="row"><button data-act="pickimg">${u.src?'Заменить изображение':'Загрузить изображение'}</button>${u.src?'<button data-act="delimg" class="ghost">Убрать</button>':''}</div><input type="file" id="fImg" accept="image/*" hidden>`;
    if(u.src){
      h+=ck('Показывать подложку','underlay.show',u.show);
      h+=`<label class="f wide"><span>Прозрачность</span><input type="range" min="0.05" max="1" step="0.05" data-path="underlay.opacity" data-num="1" value="${u.opacity}"></label>`;
      h+=`<div class="grid" style="margin-top:6px">${fld('Масштаб, %','underlay.scale',u.scale,{num:1})}${fld('Сдвиг X, м','underlay.dx',u.dx,{num:1})}${fld('Сдвиг Y, м','underlay.dy',u.dy,{num:1})}</div>`;
      h+=`<p class="hint" style="margin-top:8px">Подложка попадает и в PDF. Перед печатью скройте её.</p>`;
    }
  }
  if(tab==='stamp'){
    const p='stamp.';
    h+=`<div class="grid two">${fld('Наименование',p+'name',st.stamp.name,{wide:1})}${fld('Объект',p+'object',st.stamp.object,{wide:1})}${fld('Подзаголовок',p+'protocol',st.stamp.protocol,{wide:1,area:1})}${fld('Составил',p+'author',st.stamp.author,{wide:1})}${fld('Участники',p+'members',st.stamp.members,{wide:1})}${fld('Дата',p+'date',st.stamp.date)}${fld('Север, градусы','north',st.north,{ph:'пусто = вписать от руки'})}</div>`;
    h+=`<p class="hint" style="margin-top:6px">Север: 0 — вверх листа, 90 — вправо.</p>`;
    h+=`<h3>Дополнительные примечания</h3>${fld('По одному на строку','notes',st.notes,{wide:1,area:1})}`;
  }
  document.getElementById('side').innerHTML=h;
  if(sel){const c=document.querySelector(`[data-card="${sel.id}"]`);if(c)c.scrollIntoView({block:'nearest'});}
}
function itemCard(it){
  const p='items.'+it.id+'.';
  return `<div class="card${sel&&sel.id===it.id?' sel':''}" data-card="${it.id}"><div class="card-h">${sl('',p+'type',it.type,IT_TYPES,{re:1})}<button class="del" data-act="del" data-col="items" data-id="${it.id}">Удалить</button></div><div class="grid">`+
    fld('Подпись',p+'label',it.label)+fld('X, м',p+'x',it.x,{num:1})+fld('Y, м',p+'y',it.y,{num:1})+fld('По X, м',p+'w',it.w,{num:1})+fld('По Y, м',p+'d',it.d,{num:1})+'</div></div>';
}

function setPath(path,val){
  const ks=path.split('.');
  if(ks.length===3&&Array.isArray(state[ks[0]])){const o=state[ks[0]].find(e=>e.id===ks[1]);if(o)o[ks[2]]=val;return;}
  let o=state;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;
}
const side=document.getElementById('side');
function onField(e){
  const el=e.target;const path=el.dataset.path;if(!path)return;
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.num){v=parseFloat(String(v).replace(',','.'));if(isNaN(v))return;}
  if(path==='room.scale')v=+v;
  setPath(path,v);save();renderSheet();
  if(el.dataset.re||(e.type==='change'&&el.type==='checkbox'&&path==='room.showDims'))renderSide();
  if(path.endsWith('.n'))setTimeout(()=>{},0);
}
side.addEventListener('input',e=>{if(e.target.tagName!=='SELECT')onField(e);});
side.addEventListener('change',e=>{if(e.target.tagName==='SELECT'||e.target.type==='checkbox')onField(e);if(e.target.id==='fImg')loadImg(e.target.files[0]);});
const num=id=>parseFloat(String(document.getElementById(id).value).replace(',','.'));
side.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='example'){if(confirm('Заменить текущий план примером аудитории?')){state=example();sel=null;}}
  if(a==='blank'){if(confirm('Начать пустой план? Текущий будет заменён.')){state=blank();sel=null;}}
  if(a==='addwi'){const t=b.dataset.t;const o={id:uid(),wall:'A',type:t,label:'',off:0.5,z:t==='door'?0:t==='radiator'?0.15:0.9,w:t==='door'?1:1.2,h:t==='door'?2.1:t==='radiator'?0.6:1.5,open:false,hinge:'start'};state.wallItems.push(o);sel={kind:'wi',id:o.id};}
  if(a==='additem'){const o={id:uid(),type:'table',label:'',x:state.room.L/2-0.4,y:state.room.W/2-0.4,w:0.8,d:0.8};state.items.push(o);sel={kind:'it',id:o.id};}
  if(a==='addmk'){const n=String(state.markers.reduce((m,k)=>Math.max(m,parseInt(k.n)||0),0)+1);const o={id:uid(),n,desc:'',place:'floor',x:state.room.L/2,y:state.room.W/2,wall:'A',off:1,z:1};state.markers.push(o);sel={kind:'mk',id:o.id};}
  if(a==='del'){state[b.dataset.col]=state[b.dataset.col].filter(x=>x.id!==b.dataset.id);if(sel&&sel.id===b.dataset.id)sel=null;}
  if(a==='genrows'){const p={rows:Math.max(1,Math.round(num('gRows'))),x0:num('gX0'),step:num('gStep'),depth:num('gDepth'),margin:num('gMargin'),aisle:num('gAisle')};if(Object.values(p).some(isNaN)){toast('Проверьте числа в блоке «Ряды столов»');return;}genRows(state,p);}
  if(a==='clearDesks'){state.items=state.items.filter(i=>i.type!=='desk');}
  if(a==='pickimg'){document.getElementById('fImg').click();return;}
  if(a==='delimg'){state.underlay.src='';}
  save();renderSheet();renderSide();
});
function loadImg(f){if(!f)return;const r=new FileReader();r.onload=()=>{state.underlay.src=r.result;state.underlay.show=true;save();renderSheet();renderSide();};r.readAsDataURL(f);}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;renderTabs();renderSide();});

/* ===== Перетаскивание ===== */
let drag=null;
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
const snap=v=>Math.round(v*20)/20;
svg.addEventListener('pointerdown',e=>{
  const gEl=e.target.closest('[data-kind]');
  if(!gEl){if(sel){sel=null;renderSheet();renderSide();}return;}
  const kind=gEl.dataset.kind,id=gEl.dataset.id;
  const col=kind==='wi'?state.wallItems:kind==='it'?state.items:state.markers;
  const o=col.find(x=>x.id===id);if(!o)return;
  sel={kind,id};
  const tabFor={wi:'walls',it:'items',mk:'markers'}[kind];
  drag={o,kind,start:svgPt(e),orig:{...o},moved:false};
  svg.setPointerCapture(e.pointerId);
  if(tab!==tabFor){tab=tabFor;renderTabs();}
  renderSheet();renderSide();
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;const g=geom();const p=svgPt(e);const dx=p.x-drag.start.x,dy=p.y-drag.start.y;
  if(Math.abs(dx)+Math.abs(dy)<0.4&&!drag.moved)return;drag.moved=true;
  const o=drag.o,q=drag.orig;
  if(drag.kind==='it'||(drag.kind==='mk'&&o.place==='floor')){
    o.x=snap(q.x+dx/g.s);o.y=snap(q.y+dy/g.s);
  }else{
    const [doff,dz]=wallDelta(o.wall,dx,dy,g.s);
    o.off=snap(Math.max(-1,Math.min(wallLen(g,o.wall),q.off+doff)));
    if(drag.kind==='wi'||o.place==='wall')o.z=snap(Math.max(0,Math.min(g.h,q.z+dz)));
  }
  renderSheet();
});
svg.addEventListener('pointerup',()=>{if(drag&&drag.moved){save();renderSide();}drag=null;});

/* ===== Экспорт ===== */
function sheetString(){exporting=true;const body=drawSheet();exporting=false;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">${body}</svg>`;}
let dl=null;(async()=>{try{dl=window.claude?await window.claude.use('downloads'):null;}catch(e){dl=null;}})();
async function offer(filename,data){
  if(!dl){try{dl=window.claude?await window.claude.use('downloads'):null;}catch(e){}}
  if(!dl){toast('Скачивание недоступно в этом окне. Откройте план в claude.ai.');return;}
  try{await dl.save({filename,data});toast('Файл сохранён: '+filename);}
  catch(e){if(e&&e.code==='declined')return;toast('Не удалось сохранить файл: '+(e&&e.message||'ошибка'));}
}
const fname=ext=>{const d=(state.stamp.date||'').replace(/[^\d.]/g,'');return `plan${d?'_'+d:''}.${ext}`;};
document.getElementById('bSvg').onclick=()=>offer(fname('svg'),new Blob([sheetString()],{type:'image/svg+xml'}));
document.getElementById('bSave').onclick=()=>offer(fname('json'),JSON.stringify(state,null,1));
document.getElementById('bOpen').onclick=()=>document.getElementById('fOpen').click();
document.getElementById('fOpen').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.room||!s.wallItems)throw 0;state={...blank(),...s};sel=null;save();renderSheet();renderSide();toast('Проект открыт');}catch(_){toast('Это не файл проекта плана (.json)');}};r.readAsText(f);e.target.value='';};
document.getElementById('bPdf').onclick=async()=>{
  if(!window.jspdf){toast('Модуль PDF не загрузился. Проверьте подключение и обновите страницу.');return;}
  toast('Готовлю PDF…');
  const img=new Image();
  img.onload=async()=>{
    const dpi=200,W=Math.round(420/25.4*dpi),H=Math.round(297/25.4*dpi);
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
    const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a3'});
    pdf.addImage(c.toDataURL('image/jpeg',0.93),'JPEG',0,0,420,297);
    await offer(fname('pdf'),pdf.output('blob'));
  };
  img.onerror=()=>toast('Не удалось отрисовать лист для PDF');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sheetString());
};

/* ===== Масштаб окна ===== */
document.getElementById('zIn').onclick=()=>{zoom=Math.min(4,zoom*1.25);applyZoom();};
document.getElementById('zOut').onclick=()=>{zoom=Math.max(0.4,zoom/1.25);applyZoom();};
document.getElementById('zFit').onclick=()=>{zoom=1;applyZoom();};
window.addEventListener('resize',applyZoom);
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}

renderTabs();renderSide();renderSheet();
</script>
</body>
</html>
