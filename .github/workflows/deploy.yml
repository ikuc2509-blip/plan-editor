# Публикация на GitHub Pages: тесты → сборка → выкладка
name: Публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # пакет распознавания (этап 10): модель с Hugging Face по закреплённой версии, сверка отпечатков
      - uses: actions/cache@v4
        with:
          path: .pack-cache
          key: pack-${{ hashFiles('src/recognize/packInfo.ts') }}
      - run: node scripts/pack.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
